<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Rendered Waveshare RLCD PulseSensor dashboard screenshot</title>
  <desc id="desc">Generated mock screenshot for PulseSensor RLCD build 0.4.42-battery-runtime-rlcd, showing battery runtime, device temperature, humidity, waveform, BPM, IBI, and signal panels.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.22"/>
    </filter>
    <style>
      .page { fill: #f7f7f2; }
      .bezel { fill: #e5e0d6; stroke: #111; stroke-width: 8; }
      .screen { fill: #fbfbf6; stroke: #111; stroke-width: 10; }
      .ink { fill: #111; }
      .stroke { fill: none; stroke: #111; stroke-linecap: round; stroke-linejoin: round; }
      .mono { font-family: "Courier New", ui-monospace, monospace; font-weight: 900; fill: #111; letter-spacing: 0; }
      .label { font-size: 18px; }
      .small { font-size: 14px; }
      .tiny { font-size: 11px; }
      .value { font-size: 64px; }
      .value-small { font-size: 50px; }
    </style>
  </defs>

  <rect class="page" width="1200" height="900"/>
  <g transform="translate(88 76)" filter="url(#shadow)">
    <rect class="bezel" x="0" y="0" width="1024" height="748" rx="44"/>
    <rect x="64" y="64" width="896" height="620" rx="18" fill="#fbfbf6" stroke="#111" stroke-width="8"/>
    <text class="mono small" x="90" y="38">Waveshare ESP32-S3-RLCD-4.2</text>

    <g transform="translate(104 84) scale(2.0)">
      <rect class="screen" x="0" y="0" width="400" height="300" rx="8"/>

      <text class="mono label" x="14" y="34">PulseSensor.com</text>
      <text class="mono tiny" x="17" y="47">0.4.42-battery-runtime-rlcd</text>
      <path class="ink" d="M226 24 C220 11 199 13 200 34 C200 47 216 59 226 70 C236 59 252 47 252 34 C253 13 232 11 226 24 Z"/>

      <rect class="stroke" x="268" y="6" width="20" height="10" rx="0" stroke-width="1.5"/>
      <rect class="stroke" x="288" y="9" width="3" height="4" rx="0" stroke-width="1.5"/>
      <rect class="ink" x="270" y="8" width="13" height="6"/>
      <text class="mono tiny" x="296" y="16">Battery 81% 3.91V</text>
      <text class="mono tiny" x="268" y="31">Device temp 81F</text>
      <text class="mono tiny" x="268" y="47">Humidity 31%</text>

      <rect class="stroke" x="0" y="56" width="400" height="132" rx="6" stroke-width="4"/>
      <path class="stroke" d="M48 58 V186 M94 58 V186 M140 58 V186 M186 58 V186 M232 58 V186 M278 58 V186 M324 58 V186 M370 58 V186" stroke-width="1.5" stroke-dasharray="1 7"/>
      <path class="stroke" d="M2 90 H398 M2 122 H398 M2 154 H398" stroke-width="1.5" stroke-dasharray="1 7"/>
      <path class="stroke" d="M2 110 H398" stroke-width="2" stroke-dasharray="3 6"/>
      <text class="mono small" x="18" y="84">LIVE</text>
      <text class="mono small" x="318" y="84">THR550</text>
      <path class="stroke" d="M6 138 C32 132 47 118 62 126 C80 136 88 164 105 164 C122 164 132 138 149 112 C164 90 178 83 194 106 C209 127 218 160 234 164 C252 168 262 143 278 114 C293 91 307 84 323 103 C337 121 349 153 365 158 C381 163 390 139 397 126" stroke-width="5"/>
      <circle class="ink" cx="149" cy="112" r="7"/>
      <circle class="ink" cx="278" cy="114" r="7"/>
      <text class="mono small" x="194" y="176">LOCK  QUALIFIED BEAT</text>

      <g transform="translate(0 204)">
        <rect class="stroke" x="0" y="0" width="133" height="78" rx="6" stroke-width="4"/>
        <text class="mono small" x="16" y="27">BPM</text>
        <text class="mono value" x="18" y="75">72</text>
      </g>

      <g transform="translate(133 204)">
        <rect class="stroke" x="0" y="0" width="134" height="78" rx="6" stroke-width="4"/>
        <text class="mono small" x="16" y="27">IBI</text>
        <text class="mono value-small" x="12" y="72">833</text>
        <text class="mono tiny" x="106" y="27">ms</text>
      </g>

      <g transform="translate(267 204)">
        <rect class="stroke" x="0" y="0" width="133" height="78" rx="6" stroke-width="4"/>
        <text class="mono small" x="16" y="27">SIG GP1</text>
        <g transform="translate(16 38)">
          <rect class="ink" x="0" y="0" width="6" height="16"/>
          <rect class="ink" x="8" y="0" width="6" height="16"/>
          <rect class="ink" x="16" y="0" width="6" height="16"/>
          <rect class="ink" x="24" y="0" width="6" height="16"/>
          <rect class="ink" x="32" y="0" width="6" height="16"/>
          <rect class="ink" x="40" y="0" width="6" height="16"/>
          <rect class="ink" x="48" y="0" width="6" height="16"/>
          <rect class="ink" x="56" y="0" width="6" height="16"/>
          <rect class="ink" x="64" y="0" width="6" height="16"/>
          <rect class="ink" x="72" y="0" width="6" height="16"/>
        </g>
        <text class="mono small" x="16" y="73">A100</text>
      </g>
    </g>
  </g>
</svg>
