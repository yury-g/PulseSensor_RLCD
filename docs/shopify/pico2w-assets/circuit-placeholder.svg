<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">PulseSensor to Raspberry Pi Pico 2 W breadboard placeholder</title>
  <desc id="desc">Local circuit visual showing PulseSensor red wire to 3V3, black wire to GND, and purple signal wire to GP28 ADC2 on a Raspberry Pi Pico 2 W seated on a solderless breadboard.</desc>
  <defs>
    <style>
      .bg{fill:#f7f4ee}.panel{fill:#fff;stroke:#d9d2c5;stroke-width:2}.ink{fill:#17191f}.muted{fill:#5c6372}.label{font:700 24px Arial,sans-serif}.small{font:600 15px Arial,sans-serif}.tiny{font:600 12px Arial,sans-serif}.pin{fill:#e7edf0;stroke:#aeb9bf;stroke-width:1}.rail-red{stroke:#e63946;stroke-width:4}.rail-blue{stroke:#1f67d2;stroke-width:4}.wire-red{fill:none;stroke:#e63946;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.wire-black{fill:none;stroke:#17191f;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.wire-purple{fill:none;stroke:#7a35d8;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.thin{fill:none;stroke:#d9d2c5;stroke-width:1}.pico{fill:#159763;stroke:#0d6b48;stroke-width:3}.usb{fill:#d7dde3;stroke:#8d99a5;stroke-width:2}.chip{fill:#232833}.sensor{fill:#ffffff;stroke:#e63946;stroke-width:5}.sensor-core{fill:#e63946}.callout{fill:#fff8ef;stroke:#f2b84b;stroke-width:2}.wave{fill:none;stroke:#e63946;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect class="bg" width="1280" height="760"/>
  <rect class="panel" x="38" y="34" width="1204" height="692" rx="8"/>
  <text class="label ink" x="72" y="82">PulseSensor + Raspberry Pi Pico 2 W</text>
  <text class="small muted" x="72" y="110">Local placeholder visual for website mockups until verified photos are available.</text>

  <g id="breadboard" transform="translate(104 164)">
    <rect x="0" y="0" width="720" height="454" rx="18" fill="#fdfdfb" stroke="#b9b8ad" stroke-width="3"/>
    <rect x="32" y="38" width="656" height="48" rx="8" fill="#f3f4f5"/>
    <rect x="32" y="368" width="656" height="48" rx="8" fill="#f3f4f5"/>
    <line class="rail-red" x1="56" y1="54" x2="666" y2="54"/>
    <line class="rail-blue" x1="56" y1="72" x2="666" y2="72"/>
    <line class="rail-red" x1="56" y1="384" x2="666" y2="384"/>
    <line class="rail-blue" x1="56" y1="402" x2="666" y2="402"/>
    <rect x="332" y="108" width="56" height="238" rx="6" fill="#ece9df"/>
    <line class="thin" x1="360" y1="114" x2="360" y2="340"/>
    <text class="tiny muted" x="48" y="30">solderless breadboard</text>
    <text class="tiny muted" x="64" y="438">a b c d e</text>
    <text class="tiny muted" x="572" y="438">f g h i j</text>
    <g>
      <circle class="pin" cx="70" cy="128" r="5"/><circle class="pin" cx="96" cy="128" r="5"/><circle class="pin" cx="122" cy="128" r="5"/><circle class="pin" cx="148" cy="128" r="5"/><circle class="pin" cx="174" cy="128" r="5"/>
      <circle class="pin" cx="70" cy="164" r="5"/><circle class="pin" cx="96" cy="164" r="5"/><circle class="pin" cx="122" cy="164" r="5"/><circle class="pin" cx="148" cy="164" r="5"/><circle class="pin" cx="174" cy="164" r="5"/>
      <circle class="pin" cx="70" cy="200" r="5"/><circle class="pin" cx="96" cy="200" r="5"/><circle class="pin" cx="122" cy="200" r="5"/><circle class="pin" cx="148" cy="200" r="5"/><circle class="pin" cx="174" cy="200" r="5"/>
      <circle class="pin" cx="70" cy="236" r="5"/><circle class="pin" cx="96" cy="236" r="5"/><circle class="pin" cx="122" cy="236" r="5"/><circle class="pin" cx="148" cy="236" r="5"/><circle class="pin" cx="174" cy="236" r="5"/>
      <circle class="pin" cx="548" cy="128" r="5"/><circle class="pin" cx="574" cy="128" r="5"/><circle class="pin" cx="600" cy="128" r="5"/><circle class="pin" cx="626" cy="128" r="5"/><circle class="pin" cx="652" cy="128" r="5"/>
      <circle class="pin" cx="548" cy="164" r="5"/><circle class="pin" cx="574" cy="164" r="5"/><circle class="pin" cx="600" cy="164" r="5"/><circle class="pin" cx="626" cy="164" r="5"/><circle class="pin" cx="652" cy="164" r="5"/>
      <circle class="pin" cx="548" cy="200" r="5"/><circle class="pin" cx="574" cy="200" r="5"/><circle class="pin" cx="600" cy="200" r="5"/><circle class="pin" cx="626" cy="200" r="5"/><circle class="pin" cx="652" cy="200" r="5"/>
      <circle class="pin" cx="548" cy="236" r="5"/><circle class="pin" cx="574" cy="236" r="5"/><circle class="pin" cx="600" cy="236" r="5"/><circle class="pin" cx="626" cy="236" r="5"/><circle class="pin" cx="652" cy="236" r="5"/>
    </g>
  </g>

  <g id="pico" transform="translate(336 132)">
    <rect class="pico" x="0" y="0" width="256" height="512" rx="26"/>
    <rect class="usb" x="80" y="-14" width="96" height="42" rx="9"/>
    <rect class="chip" x="78" y="168" width="100" height="92" rx="10"/>
    <rect fill="#0f7e54" x="50" y="54" width="156" height="62" rx="10"/>
    <text class="small" fill="#fff" x="68" y="80">Raspberry Pi</text>
    <text class="label" fill="#fff" x="70" y="107">Pico 2 W</text>
    <text class="tiny" fill="#d4ffe9" x="82" y="286">GP28 / ADC2</text>
    <text class="tiny" fill="#d4ffe9" x="86" y="314">3V3</text>
    <text class="tiny" fill="#d4ffe9" x="88" y="342">GND</text>
    <g>
      <circle class="pin" cx="20" cy="44" r="7"/><circle class="pin" cx="20" cy="72" r="7"/><circle class="pin" cx="20" cy="100" r="7"/><circle class="pin" cx="20" cy="128" r="7"/><circle class="pin" cx="20" cy="156" r="7"/><circle class="pin" cx="20" cy="184" r="7"/><circle class="pin" cx="20" cy="212" r="7"/><circle class="pin" cx="20" cy="240" r="7"/><circle class="pin" cx="20" cy="268" r="7"/><circle class="pin" cx="20" cy="296" r="7"/><circle class="pin" cx="20" cy="324" r="7"/><circle class="pin" cx="20" cy="352" r="7"/><circle class="pin" cx="20" cy="380" r="7"/><circle class="pin" cx="20" cy="408" r="7"/><circle class="pin" cx="20" cy="436" r="7"/><circle class="pin" cx="20" cy="464" r="7"/>
      <circle class="pin" cx="236" cy="44" r="7"/><circle class="pin" cx="236" cy="72" r="7"/><circle class="pin" cx="236" cy="100" r="7"/><circle class="pin" cx="236" cy="128" r="7"/><circle class="pin" cx="236" cy="156" r="7"/><circle class="pin" cx="236" cy="184" r="7"/><circle class="pin" cx="236" cy="212" r="7"/><circle class="pin" cx="236" cy="240" r="7"/><circle class="pin" cx="236" cy="268" r="7"/><circle class="pin" cx="236" cy="296" r="7"/><circle class="pin" cx="236" cy="324" r="7"/><circle class="pin" cx="236" cy="352" r="7"/><circle class="pin" cx="236" cy="380" r="7"/><circle class="pin" cx="236" cy="408" r="7"/><circle class="pin" cx="236" cy="436" r="7"/><circle class="pin" cx="236" cy="464" r="7"/>
    </g>
  </g>

  <g id="sensor" transform="translate(936 238)">
    <circle class="sensor" cx="96" cy="96" r="76"/>
    <circle class="sensor-core" cx="96" cy="96" r="22"/>
    <path class="wave" d="M30 96 H54 L66 66 L84 128 L104 86 L120 96 H162"/>
    <text class="label ink" x="18" y="205">PulseSensor</text>
    <text class="small muted" x="22" y="230">red 3V3 - black GND - purple GP28</text>
  </g>

  <path class="wire-red" d="M572 446 C696 446 772 318 942 314"/>
  <path class="wire-black" d="M572 474 C720 506 805 430 942 368"/>
  <path class="wire-purple" d="M572 418 C678 372 768 364 942 342"/>

  <g transform="translate(816 524)">
    <rect class="callout" x="0" y="0" width="358" height="116" rx="8"/>
    <text class="small ink" x="20" y="32">Output path</text>
    <text class="small muted" x="20" y="58">Pico 2 W sends CSV over USB serial.</text>
    <text class="small muted" x="20" y="82">Use the PulseSensor WebSerial visualizer.</text>
  </g>

  <g transform="translate(72 648)">
    <text class="tiny muted" x="0" y="0">Draft only: GP28 / ADC2 is the current private recommendation pending real Pico 2 W hardware validation.</text>
  </g>
</svg>
